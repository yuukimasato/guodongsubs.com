baseURL = "https://guodongsubs.com/"
title = "GuodongSubs"
theme = "PaperMod"
defaultContentLanguage = "en"

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
author = "GuodongSubs"
defaultTheme = "auto"
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowToc = false
disableAnchoredHeadings = true

[params.assets]
favicon = "/uploads/favicon.ico"

[menus]
[[menus.main]]
  name = "English"
  url = "/categories/english/"
  weight = 1
[[menus.main]]
  name = "日本語"
  url = "/categories/%E6%97%A5%E6%9C%AC%E8%AA%9E/"
  weight = 2
[[menus.main]]
  name = "Our Projects"
  url = "/our-projects/"
  weight = 3
[[menus.main]]
  name = "Tags and Archives"
  url = "/archives/"
  weight = 4
[[menus.main]]
  name = "Recruitment"
  url = "/recruitment/"
  weight = 5
[[menus.main]]
  name = "About Us"
  url = "/about/"
  weight = 6

[taxonomies]
  category = "categories"
  tag = "tags"

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
